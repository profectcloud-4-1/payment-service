apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
type: Opaque
stringData:
  # Database
  DB_USERNAME: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"

  TOSS_CLIENT_API_KEY: "${TOSS_CLIENT_API_KEY}"
  TOSS_SECRET_API_KEY: "${TOSS_SECRET_API_KEY}"
  TOSS_SUCCESS_URL: "${TOSS_SUCCESS_URL}"
  TOSS_FAIL_URL: "${TOSS_FAIL_URL}"
